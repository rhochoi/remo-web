<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>없는 페이지 — 리모</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='22' fill='%231E548C'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <style>
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; background: #F8F8F6; color: #0A0A0A; font-family: Pretendard, system-ui, sans-serif; font-size: 18px; line-height: 1.7; word-break: keep-all; }
    main { max-width: 1280px; width: 100%; margin: 0 auto; padding: 0 16px; box-sizing: border-box; }

    h1 { margin: 0 0 20px; font-size: clamp(34px, 6.5vw, 72px); font-weight: 900; letter-spacing: -0.03em; line-height: 1.15; text-wrap: balance; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 12px 22px; border-radius: 999px; background: #0A0A0A; color: #F8F8F6; text-decoration: none; font-weight: 700; }
    a:focus-visible { outline: 3px solid #1E548C; outline-offset: 3px; }
  </style>
</head>

  <main>
    <h1>이 주소에는 페이지가 없습니다.</h1>

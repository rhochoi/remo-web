<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>없는 페이지 · 리모</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="stylesheet" href="/assets/tokens.css?v=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <style>
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; background: var(--paper); color: var(--ink); font-family: Pretendard, system-ui, sans-serif; font-size: 18px; line-height: 1.7; word-break: keep-all; }
    main { max-width: 1280px; width: 100%; margin: 0 auto; padding: 0 16px; box-sizing: border-box; }
    @media (min-width: 880px) { main { padding: 0 80px; } }
    h1 { margin: 0 0 20px; font-size: clamp(34px, 6.5vw, 72px); font-weight: 900; letter-spacing: -0.03em; line-height: 1.15; text-wrap: balance; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 12px 22px; border-radius: 999px; background: var(--ink); color: var(--paper); border: 3px solid var(--ink); text-decoration: none; font-weight: 700; }
    a:focus-visible { outline: 3px solid var(--ink); box-shadow: 0 0 0 6px var(--orange); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>이 주소에는 페이지가 없습니다.</h1>
    <a href="/">리모 첫 화면으로 →</a>
  </main>
</body>
</html>

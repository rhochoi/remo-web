  }

  /* ───────── 7. 행렬: 10×10 칸 (Ghoniem 등의 행렬 대 노드링크 비교 연구) ───────── */
  function v7(svg, st) {

  }

  /* ───────── 8. 아크 다이어그램: 한 줄 위의 호 (조용하고 모바일 친화적) ───────── */
  function v8(svg, st) {
    const y = 250, xs = N.map((n, i) => 50 + i * (420 / 9)), ga = mk('g', {}, svg); let hov = null, arcs = [];
    mk('path', { d: `M30 ${y}H490`, stroke: '#1A1A1A', 'stroke-width': 5, 'stroke-linecap': 'round' }, svg);
    const nodes = N.map((n, i) => { const g = mk('g', { transform: `translate(${xs[i]} ${y})`, style: 'cursor:pointer' }, svg); mk('circle', { r: 15, fill: '#fff', ...ink }, g); g.addEventListener('pointerenter', () => { hov = n.n; paint(); }); g.addEventListener('pointerleave', () => { hov = null; paint(); }); return g; });
    const idx = Object.fromEntries(N.map((n, i) => [n.n, i]));
    const build = () => { ga.replaceChildren(); arcs = act().map(e => { const a = xs[idx[e.s]], b = xs[idx[e.t]], dir = type === 'synergy' ? -1 : (idx[e.s] < idx[e.t] ? -1 : 1), h = Math.abs(b - a) * .62 * dir, dd = `M${a} ${y}C${a} ${y + h} ${b} ${y + h} ${b} ${y}`; return { e, o: mk('path', { d: dd, fill: 'none', stroke: '#1A1A1A', 'stroke-width': (e.w === 3 ? 5 : 3) + 4, 'stroke-linecap': 'round' }, ga), i: mk('path', { d: dd, fill: 'none', stroke: '#fff', 'stroke-width': e.w === 3 ? 5 : 3, 'stroke-linecap': 'round' }, ga) }; }); nodes.forEach((g, i) => g.firstChild.setAttribute('fill', deg(N[i].n) ? '#fff' : 'rgba(255,255,255,.55)')); };
    const paint = () => arcs.forEach(({ e, o, i }) => { const dim = hov && e.s !== hov && e.t !== hov; o.style.opacity = i.style.opacity = dim ? .12 : 1; });
    st.on(build); build(); return null;
  }

  /* ───────── 9. 점 격자 자석: 배경 점들이 사람과 포인터에 끌린다 (캔버스) ───────── */
  function v9(svg, st, cv) {
    const ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2); cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);

      ctx.clearRect(0, 0, W, H); const es = act(), by = Object.fromEntries(N.map(n => [n.n, n]));

    };
  }

  /* ───────── 10. 노선도: 45도 꺾임 선과 정거장 (지하철 노선도 문법) ───────── */
  function v10(svg, st) {
    const gl = mk('g', {}, svg), gs = mk('g', {}, svg), sn = n => ({ x: Math.round(n.px / 40) * 40, y: Math.round(n.py / 35) * 35 }); let hov = null, ls = [];

    const build = () => { gl.replaceChildren(); ls = act().map(e => { const dd = route(by[e.s], by[e.t]); return { e, o: mk('path', { d: dd, fill: 'none', stroke: '#1A1A1A', 'stroke-width': (e.w === 3 ? 8 : 5) + 5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, gl), i: mk('path', { d: dd, fill: 'none', stroke: '#fff', 'stroke-width': e.w === 3 ? 8 : 5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, gl) }; }); stations.forEach((g, i) => { const d = deg(S[i].n); g.firstChild.setAttribute('r', d >= 4 ? 17 : 13); g.firstChild.setAttribute('fill', d ? '#fff' : 'rgba(255,255,255,.55)'); }); };
    const paint = () => ls.forEach(({ e, o, i }) => { const dim = hov && e.s !== hov && e.t !== hov; o.style.opacity = i.style.opacity = dim ? .12 : 1; });

  }

  const VARIANTS = [
    ['도형 구슬', 'Physics', '서로 다른 기하 도형을 잡아 던진다. 관계가 스프링', 'Framer의 Gravi·Reactive Balls 같은 물리 놀이터 패턴', v1],
    ['궤도판', 'Orbit', '홈 첫 화면의 궤도 문법. 드래그로 돌려 본다', '궤도를 도는 팀 프로필(Contra 사례)과 같은 계열', v2],
    ['고(goo)', 'Gooey', '관계가 있으면 하나로 번지는 방울', 'Codrops·CSS-Tricks의 gooey SVG 필터', v3],
    ['코드 다이어그램', 'Chord', '원 둘레의 호와 곡선. 가리키면 나머지가 물러난다', 'amCharts·Flourish의 chord diagram', v4],
    ['별자리', 'Constellation', '포인터 주변에서만 선이 드러난다', 'Nadieh Bremer의 별자리 시각화 계열', v5],
    ['핀보드', 'Pinboard', '쪽지를 잡아 옮기면 실이 따라온다', '핀과 실 은유(웹 사례는 찾지 못함)', v6],
    ['행렬', 'Matrix', '10×10 칸. 가리키면 행·열이 밝아진다', 'Ghoniem 등의 행렬 대 노드링크 연구', v7],
    ['아크', 'Arc', '한 줄 위에 호. 위·아래로 방향을 가른다', '아크 다이어그램(일반 기법, 출처 미확인)', v8],
    ['점 격자 자석', 'Magnetic grid', '배경 점이 사람과 포인터에 끌린다', '자석형 점 격자(일반 패턴, 출처 미확인)', v9],
    ['노선도', 'Transit', '45도 꺾임 선과 정거장', '지하철 노선도 문법(일반 기법, 출처 미확인)', v10],
  ];

  fetch('../data/relations.json').then(r => r.json()).then(d => {
    D = d; E = d.edges; const xs = d.nodes.map(n => n.x), ys = d.nodes.map(n => n.y), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    N = d.nodes.map(n => ({ ...n, px: 50 + (n.x - x0) / (x1 - x0) * (W - 100), py: 50 + (n.y - y0) / (y1 - y0) * (H - 100) }));
    const grid = $('#grid'), ticks = [];
    VARIANTS.forEach(([name, en, note, ref, fn], i) => {
      const card = document.createElement('article'); card.className = 'card';
      card.innerHTML = `<div class="stage"></div><div class="meta"><h2><small>${String(i + 1).padStart(2, '0')} ${en.toUpperCase()}</small>${name}</h2><p>${note}</p><p class="ref">참고: ${ref}</p></div>`;
      grid.appendChild(card); const stage = card.firstChild, isCanvas = fn === v9;
      const el = isCanvas ? document.createElement('canvas') : document.createElementNS(NS, 'svg'); if (!isCanvas) { el.setAttribute('viewBox', `0 0 ${W} ${H}`); el.setAttribute('role', 'img'); el.setAttribute('aria-label', `${name} 방식으로 그린 구성원 관계 시안`); } else el.setAttribute('aria-label', `${name} 방식으로 그린 구성원 관계 시안`);
